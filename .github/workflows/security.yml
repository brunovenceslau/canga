# Vulnerability scan. govulncheck reports only vulnerabilities the build can
# actually reach, so a finding here is actionable rather than advisory.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # A dependency becomes vulnerable long after it is merged, so the scan runs
    # on a clock as well as on a diff.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    # Pinned, never *-latest: the Ubuntu version tracks the sbx sandbox image
    # (measured 26.04 on 2026-09-28) and moves with it; see test.yml.
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable

      - name: Install scanner
        run: make tool-vuln

      - name: Scan
        run: make vuln
