# Vulnerability scan. govulncheck reports only vulnerabilities the build can
# actually reach, so a finding here is actionable rather than advisory.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # A dependency becomes vulnerable long after it is merged, so the scan runs
    # on a clock as well as on a diff.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Install scanner
        run: make tool-vuln

      - name: Scan
        run: make vuln
