# Vulnerability scan. govulncheck reports only vulnerabilities the build can
# actually reach, so a finding here is actionable rather than advisory.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # A dependency becomes vulnerable long after it is merged, so the scan runs
    # on a clock as well as on a diff.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable

      - name: Install scanner
        run: make tool-vuln

      - name: Scan
        run: make vuln
