# Vulnerability scan. govulncheck reports only vulnerabilities the build can
# actually reach, so a finding here is actionable rather than advisory.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # A dependency becomes vulnerable long after it is merged, so the scan runs
    # on a clock as well as on a diff.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Install scanner
        run: make tool-vuln

      - name: Scan
        run: make vuln
