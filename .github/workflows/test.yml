# Tests and cross-compilation. Both jobs invoke a `make` target rather than
# restating the flags, so what CI runs is what a push was checked against
# locally.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      # Without zsh, TestCompletionScript skips its `zsh -n` parse of the
      # generated completion script and still reports a pass. Installing it
      # keeps the gate real rather than letting a missing shell look green.
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh

      # TestSbxKit_Shellcheck lints the sbx kit's install script and
      # scripts/sbx-kit-pin.sh, and fails under CI without shellcheck. Pinned
      # by version and sha256 rather than taken from the runner image, whose
      # copy changes with the image and would change the verdict with it.
      - name: Install shellcheck
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          archive="shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${archive}"
          echo "${SHELLCHECK_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          tar -xJf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}"
          sudo install -m 0755 "${RUNNER_TEMP}/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      - name: Verify dependencies
        run: |
          go mod verify
          go mod download

      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      # -diff never touches the tree; per `go help fix` it prints the unified
      # diff and exits non-zero when it is not empty, so a pending `go fix`
      # rewrite fails the gate instead of drifting in unnoticed.
      - name: Check go fix
        run: go fix -diff ./...

      - name: Test
        run: make test

  # A second operating system in the test matrix would cost a runner to catch
  # what compiling for that system catches directly. This builds every platform
  # a release ships, from whichever one the runner happens to be.
  cross:
    name: Cross-compile
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Build every release platform
        run: make cross
