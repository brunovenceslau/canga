# Tests. The job invokes `make test` rather than restating the flags: the gate
# is defined once, in the Makefile, so what CI runs is what a push was checked
# against locally.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both host families are first-class: the macs run devctl, and so do the
        # linux agent sandboxes.
        os: [ubuntu-latest, macos-latest]
        go: ["1.27", "stable"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}

      - name: Verify dependencies
        run: |
          go mod verify
          go mod download

      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        run: make build

      - name: Test
        run: make test
