# Tests and cross-compilation. Every job invokes a `make` target rather than
# restating the flags, so what CI runs is what a push was checked against
# locally.
#
# Gates test exactly the expected usage (operator rule, 2026-09-28): the host
# build runs on the operator's Macs, so its tests run on macOS, arm64 and
# Intel; the sandbox build runs in sbx sandboxes, linux VMs of the host's
# architecture, so its tests run on Linux, arm64 and x64. Compiling for a
# platform is not running on it: a case-insensitive APFS, or a macOS
# userland, is only exercised where it exists.
#
# Runner labels are PINNED, never *-latest: "latest" moves on GitHub's
# schedule and changes the verdict without this file changing. The Ubuntu
# version tracks the sbx sandbox image (docker/sandbox-templates:claude-code,
# measured Ubuntu 26.04.1 on 2026-09-28) and moves when that image moves.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  host:
    name: Host build (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        # macos-26 is Apple silicon (arm64); macos-26-intel is x64.
        runner: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      # Pinned shellcheck and jq, and zsh where the image lacks it: see the
      # script for why none of them is taken from the runner image.
      - name: Install test tools
        run: |
          scripts/ci-tools.sh "${RUNNER_TEMP}/bin"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: Verify dependencies
        run: go mod verify

      # The host build, the shared packages and install_host.sh. It includes
      # TestHost_APFSWrongCaseKeysAsStored, which runs only on darwin and
      # checks the key on a real case-insensitive volume.
      - name: Test
        run: make test-host

      - name: Build the host binary
        run: go build -trimpath -o "${RUNNER_TEMP}/canga" ./cmd/host/canga && "${RUNNER_TEMP}/canga" --version

  sandbox:
    name: Sandbox build (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04-arm, ubuntu-26.04]
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      # TestSbxKit_Shellcheck and TestSbxKitPin_ReleaseJQ fail under CI when
      # their tool is missing, rather than skip, so a gate that stopped
      # checking cannot look green.
      - name: Install test tools
        run: |
          scripts/ci-tools.sh "${RUNNER_TEMP}/bin"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: Verify dependencies
        run: |
          go mod verify
          go mod download

      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      # -diff never touches the tree; per `go help fix` it prints the unified
      # diff and exits non-zero when it is not empty, so a pending `go fix`
      # rewrite fails the gate instead of drifting in unnoticed.
      - name: Check go fix
        run: go fix -diff ./...

      # The sandbox build, the shared packages, install_sandbox.sh and the
      # release tooling, which all run on Linux.
      - name: Test
        run: make test-sandbox

      # Builds the sandbox binary and drives it as an agent in a sandbox
      # would: host paths handed over, HOME its own.
      - name: Sandbox E2E
        run: make e2e-sandbox

  # Compiles every platform a release ships, and nothing else, so a build
  # tag or syscall missing on one of them fails here rather than at release
  # time. It complements the legs above; it does not stand in for them.
  cross:
    name: Cross-compile
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Build every release platform
        run: make cross
