# GoReleaser — cross-compiled binaries attached to a GitHub release on a v* tag.
version: 2

project_name: devctl

builds:
  - id: devctl
    main: ./cmd/devctl
    binary: devctl
    env:
      - CGO_ENABLED=0
    # The macs are darwin/{arm64,amd64}; the agent sandboxes are linux VMs, and
    # devctl runs INSIDE them too, so linux is not optional here.
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      # {{.Tag}}, not {{.Version}}: Version drops the leading "v", so a release
      # used to report "0.1.0" while `make build` reported "v0.1.0" for the same
      # commit. `devctl upgrade` compares these two spellings against each
      # other, and normalizes them for the releases already published — but one
      # spelling is what they should have been all along.
      - -X main.version={{.Tag}}
      - -X main.commit={{.Commit}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ["^docs", "^test", "^ci", "^chore", "^style"]
