# GoReleaser — cross-compiled binaries attached to a GitHub release on a v* tag.
version: 2

project_name: canga

builds:
  # Two builds of one binary name. canga's role is chosen at build time: each
  # role is its own main package, and the sandbox one does not contain the
  # host's commands, so an agent cannot reach them.
  - id: host
    main: ./cmd/host/canga
    binary: canga
    env:
      - CGO_ENABLED=0
    # The host build runs on the operator's Macs, darwin/{arm64,amd64}, and
    # nowhere else, so that is all it is published for (operator decision,
    # 2026-09-28). The Makefile's cross gate compiles exactly this set, and
    # platforms_test.go pins the two together.
    goos: [darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      # {{.Tag}}, not {{.Version}}: Version drops the leading "v", so a release
      # used to report "0.1.0" while `make build` reported "v0.1.0" for the same
      # commit. `canga upgrade` compares these two spellings against each
      # other, and normalizes them for the releases already published — but one
      # spelling is what they should have been all along.
      - -X main.version={{.Tag}}
      - -X main.commit={{.Commit}}

  # The build the agent sandboxes get. They are linux VMs of the host's
  # architecture, so linux/{arm64,amd64} is the whole platform list.
  - id: sandbox
    main: ./cmd/sandbox/canga
    binary: canga
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Tag}}
      - -X main.commit={{.Commit}}

# One archive per role. Both hold a file named canga, so the role in the
# archive name is the only thing that tells them apart: `canga upgrade` in
# each build selects that build's archive by its prefix, and the sandbox kit
# pins a canga-sandbox_ one. The templates below are part of that contract.
archives:
  - id: host
    ids: [host]
    formats: [tar.gz]
    name_template: "canga-host_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  - id: sandbox
    ids: [sandbox]
    formats: [tar.gz]
    name_template: "canga-sandbox_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

# A draft, left for the Release workflow to publish once it has attested
# the assets (.github/workflows/release.yml): with immutable releases on,
# nothing may be uploaded after publishing, and the attestation has to
# exist before anyone can download and pin an archive. A rerun after a
# failed run replaces the draft that run left instead of adding a second
# draft for the same tag beside it; GitHub does not serve a draft by its
# tag, so GoReleaser would never find it otherwise. replace_existing_draft
# matches a draft by NAME, while the workflow's publish step matches it by
# TAG, so the name is pinned to the tag here rather than left to
# GoReleaser's default (which is the same today): the two must agree.
release:
  draft: true
  replace_existing_draft: true
  name_template: "{{ .Tag }}"

# github-native asks GitHub to generate the release notes itself (the same
# notes `gh release create --generate-notes` would write), which is why the
# manual "create the release by hand" step existed in the first place. `sort`
# and `filters` only apply to GoReleaser's own changelog rendering, so they
# have no effect once GitHub is the one generating it, and are dropped here
# rather than left as dead configuration.
changelog:
  use: github-native
