# A Docker Sandboxes (sbx) kit that installs the sandbox build of canga. An
# environment references it from this repository, pinned to a commit:
#
#   kits:
#     - git+https://github.com/brunovenceslau/canga.git#ref=<commit>&dir=sbx-kit
#
# The README's "Use the sbx kit" section has the whole procedure, including
# the kit.allowedSources setting sbx needs before it loads a GitHub kit.
#
# The pin below names a release that already exists, and moves in a pull
# request of its own after each release. The README's "Move the sbx kit's
# pin" section says how, and why the hashes live in this file.
schemaVersion: "2"
kind: mixin
name: canga
displayName: canga (sandbox build)
description: Installs a pinned release of canga's sandbox build, so an agent can list and add to the per-repository reminders that canga's host build manages. Binary only; needs curl in the sandbox.

agentInstructions:
  content: |
    ## canga

    `canga` is installed at `/usr/local/bin/canga`, the SANDBOX build of a
    canga release, pinned by version and sha256. Its reminders commands are
    keyed by the repository the current directory (or `-C <dir>`) belongs
    to:

    - `canga reminders list` prints one `<id><TAB><text>` record per line.
    - `canga reminders add <text>...` records a reminder and prints its id.
      Use it for an idea that is unrelated to the task at hand, so it
      survives this session.

    Removing and reordering reminders is not available here by design: the
    sandbox build does not contain those commands, and says so when asked.
    The list belongs to the operator, who uses the host build of `canga`.

    `sudo canga upgrade` replaces `/usr/local/bin/canga` with the newest
    release of the sandbox build (`--check` reports it and changes nothing).
    The binary is owned by root, hence `sudo`. The upgrade lasts for this
    sandbox only: recreating it installs the kit's pinned release again.
    Do not pass `--tag v0.6.0` or older: those sandbox builds have no
    `upgrade` command, so the sandbox cannot upgrade again until it is
    recreated.

    The store is `$CANGA_REMINDERS_DIR` when the environment sets it (a
    mount of the host's store, so the host and the sandbox share one list).
    Without it, `canga` falls back to a store inside this sandbox, which
    does not outlive it.

# Deny-by-default egress; allow only the hosts this kit's binary is fetched
# from, so the kit works whatever other kits the environment lists.
#
# - github.com             Redirects `releases/download/...` URLs to the CDN
#   host below. HTTPS (443).
# - api.github.com         Not used by the install step. `canga upgrade` reads
#   the release document and downloads the asset through the REST API (a
#   constant in canga, not configurable), which redirects the download to the
#   CDN host below. HTTPS (443).
# - release-assets.githubusercontent.com  Where both redirects serve the asset
#   bytes from; without it the redirect target is blocked even though the
#   first request succeeds. HTTPS (443).
permissions:
  network:
    allow:
      - "github.com:443"
      - "api.github.com:443"
      - "release-assets.githubusercontent.com:443"

setup:
  install:
    - command: |
        #!/bin/sh
        set -eu

        # Fail with the cause, not with `curl: not found` halfway through.
        # This kit does not install curl: the sandbox image or an earlier kit
        # in the environment's list provides it. The loop names every tool
        # the step runs, so any other gap fails here too.
        for tool in curl sha256sum tar install mktemp; do
          if ! command -v "${tool}" >/dev/null 2>&1; then
            echo "canga: ${tool} is not installed; list a kit that installs it before this one" >&2
            exit 1
          fi
        done

        # Pinned by version AND per-arch sha256, the canga-sandbox_ lines of
        # that release's checksums.txt, written together by
        # scripts/sbx-kit-pin.sh only. The sha256 is the gate: integrity of
        # the bytes the pin names, checked before anything is extracted.
        CANGA_VERSION="0.10.1"

        # Detect the arch instead of hardcoding it: the sandbox arch follows
        # the host. The sandbox build is published for linux only.
        case "$(uname -m)" in
          x86_64 | amd64)
            arch="amd64"
            sha256="e96d4d9753c70d6cf99f4adada84a5d490dd53818630e8ae49c916e52ce930ec"
            ;;
          aarch64 | arm64)
            arch="arm64"
            sha256="6e54bf2eb6518b32bd91a0260968da618db2c7647d823a91412c9d13538c97e4"
            ;;
          *)
            echo "canga: unsupported architecture: $(uname -m)" >&2
            exit 1
            ;;
        esac

        # The canga-sandbox_ prefix is the role: a release also carries
        # canga-host_ archives, whose binary holds the commands (reminders rm
        # and reorder, git, ...) that must never reach a sandbox.
        tarball="canga-sandbox_${CANGA_VERSION}_linux_${arch}.tar.gz"
        echo "canga: installing ${CANGA_VERSION} (sandbox build) for linux-${arch} (${tarball})..."

        # A scratch directory, so a leftover file of the same name in the
        # step's working directory can never be what gets verified.
        work="$(mktemp -d)"
        trap 'rm -rf "${work}"' EXIT

        curl -fsSL "https://github.com/brunovenceslau/canga/releases/download/v${CANGA_VERSION}/${tarball}" -o "${work}/${tarball}"
        # Its own step: under set -e a failing `check && extract` would only
        # skip the extraction and let the step carry on.
        (cd "${work}" && echo "${sha256}  ${tarball}" | sha256sum -c -)
        # Name the one entry wanted: the archive also carries LICENSE and
        # README.md.
        tar -xzf "${work}/${tarball}" -C "${work}" canga
        # Root-owned in /usr/local/bin: on PATH for every user, and out of
        # reach of a process without root. That is no boundary against an
        # agent with sudo, which a Docker Sandbox grants its agent user; the
        # same sudo is how `sudo canga upgrade` replaces this binary in a
        # live sandbox, drifting from the pin until the sandbox is recreated.
        install -m 0755 "${work}/canga" /usr/local/bin/canga
        # Prints "vX (sandbox, <commit>, <go>)": the provision log shows which
        # role was installed, not only which version.
        canga --version
      user: "0"
